


plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id 'com.google.gms.google-services'
    id 'com.google.firebase.firebase-perf'
    id 'com.google.firebase.crashlytics'
}

// GradleException is available without import in Gradle scripts

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new Exception("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "flexischoolerpapp.sapinfotek.com"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    configurations.all {
        resolutionStrategy {
            force 'androidx.core:core:1.15.0'
            force 'androidx.core:core-ktx:1.15.0'
            force 'androidx.browser:browser:1.8.0'
        }
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    aaptOptions {
        additionalParameters = ["--warn-manifest-validation"]
    }
    
    // Support for 16 KB page sizes
    bundle {
        abi {
            enableSplit = true
        }
    }

    defaultConfig {
        applicationId = "flexischoolerpapp.sapinfotek.com"
        minSdkVersion = flutter.minSdkVersion
        targetSdk = 36
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
        multiDexEnabled true
        
        // Specify supported ABIs for proper alignment
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }
    
    packagingOptions {
        // Ensure native libraries are aligned for 16 KB page size support
        jniLibs {
            useLegacyPackaging = false
        }
        
        // Ensure proper alignment for 16KB page sizes
        dex {
            useLegacyPackaging = false
        }
        
        // Handle duplicate native libraries
        pickFirst "lib/arm64-v8a/libc++_shared.so"
        pickFirst "lib/x86_64/libc++_shared.so"
        pickFirst "lib/armeabi-v7a/libc++_shared.so"
        pickFirst "lib/x86/libc++_shared.so"
        
        // Additional picks for Flutter engine libraries
        pickFirst "lib/arm64-v8a/libflutter.so"
        pickFirst "lib/armeabi-v7a/libflutter.so"
        pickFirst "lib/x86_64/libflutter.so"
        pickFirst "lib/x86/libflutter.so"
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            
            // Ensure minification is enabled
            minifyEnabled true
            shrinkResources true
            
            // Use default proguard rules
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            
            // Configure native debug symbol handling
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'
            }
        }

        debug {
            signingConfig signingConfigs.release
        }
    }
}

flutter {
    source = "../.."
}


dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation 'com.google.firebase:firebase-perf:20.5.1'
//    implementation 'com.google.firebase:firebase-core:22.0.0'
    
    // Material Components for Android - required for edge-to-edge support
    implementation 'com.google.android.material:material:1.11.0'
    
    // AndroidX Core library for WindowCompat
    implementation 'androidx.core:core-ktx:1.12.0'
    
    // AndroidX Activity library for modern edge-to-edge API
    implementation 'androidx.activity:activity-ktx:1.8.2'
}











